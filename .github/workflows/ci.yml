name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/eugene1805/saas-billing

jobs:
  build-and-test:
    name: Build, unit and multi-Postgres integration tests (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Saas.Billing.slnx

      - name: Build solution
        run: dotnet build Saas.Billing.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Saas.Billing.UnitTests/Saas.Billing.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run multi-instance PostgreSQL integration tests (Testcontainers)
        run: dotnet test tests/Saas.Billing.IntegrationTests/Saas.Billing.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  docker-build:
    name: Docker build and multi-DB integration verification
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container image (no push)
        run: |
          docker build \
            --file Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.title=saas-billing" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Verify container health probes and Newman suite across multi-tenant PostgreSQL instances
        run: |
          set -euo pipefail
          DB_NAMES=(
            "saas-billing-ci-norte-db"
            "saas-billing-ci-valle-db"
          )

          cleanup() {
            local status=$?
            if [ "${status}" -ne 0 ]; then
              if docker ps -a --format '{{.Names}}' | grep -qx 'saas-billing-ci'; then
                echo "=== saas-billing-ci logs ==="
                docker logs saas-billing-ci || true
              fi
              for db in "${DB_NAMES[@]}"; do
                if docker ps -a --format '{{.Names}}' | grep -qx "${db}"; then
                  echo "=== ${db} logs ==="
                  docker logs "${db}" || true
                fi
              done
            fi
            docker rm -f saas-billing-ci "${DB_NAMES[@]}" >/dev/null 2>&1 || true
            docker network rm saas-billing-ci-net >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          NORTE_PASS=$(openssl rand -hex 16)
          VALLE_PASS=$(openssl rand -hex 16)
          CI_JWT_KEY=$(openssl rand -hex 32)

          docker network create saas-billing-ci-net

          start_pg() {
            local name="$1"
            local db="$2"
            local user="$3"
            local pass="$4"
            docker run -d \
              --name "${name}" \
              --network saas-billing-ci-net \
              -e "POSTGRES_DB=${db}" \
              -e "POSTGRES_USER=${user}" \
              -e "POSTGRES_PASSWORD=${pass}" \
              postgres:17-alpine
          }

          wait_pg() {
            local name="$1"
            local db="$2"
            local user="$3"
            local pass="$4"
            local ready=0
            for i in $(seq 1 45); do
              if docker exec "${name}" pg_isready -h 127.0.0.1 -p 5432 -U "${user}" -d "${db}" >/dev/null 2>&1 && \
                 docker exec -e "PGPASSWORD=${pass}" "${name}" psql -h 127.0.0.1 -p 5432 -U "${user}" -d "${db}" -tAc "SELECT 1" 2>/dev/null | grep -qx 1; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "${ready}" -ne 1 ]; then
              echo "PostgreSQL container ${name} did not become ready on TCP 5432 within 45s"
              exit 1
            fi
            docker exec "${name}" pg_isready -h 127.0.0.1 -p 5432 -U "${user}" -d "${db}"
          }

          start_pg "saas-billing-ci-norte-db" "vital_billing_norte" "vital_billing_norte" "${NORTE_PASS}"
          start_pg "saas-billing-ci-valle-db" "vital_billing_valle" "vital_billing_valle" "${VALLE_PASS}"

          wait_pg "saas-billing-ci-norte-db" "vital_billing_norte" "vital_billing_norte" "${NORTE_PASS}"
          wait_pg "saas-billing-ci-valle-db" "vital_billing_valle" "vital_billing_valle" "${VALLE_PASS}"

          docker run -d \
            --name saas-billing-ci \
            --network saas-billing-ci-net \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -p 127.0.0.1:8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e TenantDatabases__Connections__10000000-0000-0000-0000-000000000001="Host=saas-billing-ci-norte-db;Port=5432;Database=vital_billing_norte;Username=vital_billing_norte;Password=${NORTE_PASS}" \
            -e TenantDatabases__Connections__10000000-0000-0000-0000-000000000002="Host=saas-billing-ci-valle-db;Port=5432;Database=vital_billing_valle;Username=vital_billing_valle;Password=${VALLE_PASS}" \
            -e Jwt__Issuer=saas-identity \
            -e Jwt__Audience=vital-saas \
            -e Jwt__SigningKey="${CI_JWT_KEY}" \
            -e Ports__Http=8080 \
            -e Platform__Mode=Local \
            -e AccessControl__Mode=Local \
            -e Clinical__Mode=Local \
            -e Directory__Mode=Local \
            -e SeedDemoData=true \
            -e OpenApi__Enabled=true \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          api_ready=0
          for i in $(seq 1 45); do
            if [ "$(docker inspect -f '{{.State.Running}}' saas-billing-ci 2>/dev/null || echo false)" != "true" ]; then
              echo "saas-billing-ci exited unexpectedly during startup"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null 2>&1; then
              api_ready=1
              break
            fi
            sleep 1
          done
          if [ "${api_ready}" -ne 1 ]; then
            echo "saas-billing-ci did not pass /health/ready within 45s"
            exit 1
          fi

          curl -fsS http://127.0.0.1:8080/health/live
          echo ""
          curl -fsS http://127.0.0.1:8080/health/ready
          echo ""
          curl -fsS http://127.0.0.1:8080/health
          echo ""
          curl -fsS http://127.0.0.1:8080/openapi/v1.json >/dev/null

          docker run --rm \
            --network saas-billing-ci-net \
            -v "${GITHUB_WORKSPACE}/tests/postman:/etc/newman:ro" \
            postman/newman:alpine \
            run /etc/newman/Vital.Billing.postman_collection.json \
            --env-var "baseUrl=http://saas-billing-ci:8080" \
            --env-var "jwtSigningKey=${CI_JWT_KEY}"

          VALLE_SHEETS=$(docker exec -e "PGPASSWORD=${VALLE_PASS}" saas-billing-ci-valle-db psql -h 127.0.0.1 -p 5432 -U vital_billing_valle -d vital_billing_valle -tAc "SELECT COUNT(*) FROM billing.charge_sheets;")
          echo "VALLE_SHEETS=${VALLE_SHEETS}"
          [ "${VALLE_SHEETS}" = "0" ]

      - name: Save validated image artifact (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" -o /tmp/saas-billing-image.tar

      - name: Upload validated image artifact (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saas-billing-image-${{ github.sha }}
          path: /tmp/saas-billing-image.tar
          retention-days: 1
          if-no-files-found: error

  publish-ghcr:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - name: Download validated image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: saas-billing-image-${{ github.sha }}
          path: /tmp

      - name: Load validated container image
        run: docker load -i /tmp/saas-billing-image.tar

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push validated image and record digest
        run: |
          IMAGE_REF="${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_REF}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}")
          {
            echo "### GHCR Publication Summary"
            echo ""
            echo "- **Image reference:** \`${IMAGE_REF}\`"
            echo "- **Published digest:** \`${DIGEST}\`"
            echo "- **Source commit SHA:** \`${GITHUB_SHA}\`"
            echo "- **Event / Ref:** \`${GITHUB_EVENT_NAME}\` / \`${GITHUB_REF}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io || true
